<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF1493">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOCTURNE VINYL</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <nav class="flex justify-between items-center py-4 glassmorphism w-full">
        <div class="ml-4">
            <img src="uploaded-image.jpg" alt="NOCTURNE VINYL" class="h-12 w-12">
        </div>
        <ul class="flex items-center justify-between mr-4">
            <li class="mr-4"><a href="#" class="text-white hover:text-gray-400">HOME</a></li>
            <li class="mr-4"><a href="#" class="text-white hover:text-gray-400">COLLECTION</a></li>
            <li class="mr-4"><a href="#" class="text-white hover:text-gray-400">NEW ARRIVALS</a></li>
            <li class="mr-4"><a href="#" class="text-white hover:text-gray-400">ABOUT</a></li>
            <li class="mr-4"><a href="#" class="text-white hover:text-gray-400">JOURNAL</a></li>
        </ul>
        <div class="flex items-center justify-between mr-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span id="cart-count" class="text-white">0</span>
        </div>
    </nav>
    <section class="hero h-screen glassmorphism flex justify-center items-center">
        <img src="uploaded-image.jpg" alt="Hero Image" class="object-cover h-full w-full">
        <div class="absolute top-0 left-0 right-0 bottom-0 bg-black bg-opacity-50 flex justify-center items-center">
            <h1 class="text-5xl text-white font-bold">NOCTURNE VINYL</h1>
        </div>
    </section>
    <section class="py-12 glassmorphism w-full">
        <div class="container mx-auto p-4">
            <h2 class="text-3xl text-white font-bold mb-4">PRESSES</h2>
            <div class="flex items-center justify-between mb-4">
                <p class="text-white">FREE WORLDWIDE SHIPPING</p>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <div class="flex items-center justify-between mb-4">
                <p class="text-white">AUTHENTIC & GRADED</p>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>
    </section>
    <section class="py-12 glassmorphism w-full">
        <div class="container mx-auto p-4">
            <h2 class="text-3xl text-white font-bold mb-4">FEATURED COLLECTION</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-800 p-4 rounded">
                    <img src="uploaded-image.jpg" alt="Product 1" class="h-48 w-full object-cover mb-4">
                    <h3 class="text-white font-bold mb-2">Midnight Cosmos Vol II</h3>
                    <p class="text-white mb-4">$45</p>
                    <button class="bg-gray-900 text-white py-2 px-4 rounded" onclick="addToCart(1)">ADD TO CART</button>
                </div>
                <div class="bg-gray-800 p-4 rounded">
                    <img src="uploaded-image.jpg" alt="Product 2" class="h-48 w-full object-cover mb-4">
                    <h3 class="text-white font-bold mb-2">Neon Dreams - Limited</h3>
                    <p class="text-white mb-4">$52</p>
                    <button class="bg-gray-900 text-white py-2 px-4 rounded" onclick="addToCart(2)">ADD TO CART</button>
                </div>
                <div class="bg-gray-800 p-4 rounded">
                    <img src="uploaded-image.jpg" alt="Product 3" class="h-48 w-full object-cover mb-4">
                    <h3 class="text-white font-bold mb-2">Sound In The Dark</h3>
                    <p class="text-white mb-4">$39</p>
                    <button class="bg-gray-900 text-white py-2 px-4 rounded" onclick="addToCart(3)">ADD TO CART</button>
                </div>
            </div>
        </div>
    </section>
    <section class="py-12 glassmorphism w-full">
        <div class="container mx-auto p-4">
            <h2 class="text-3xl text-white font-bold mb-4">NEWSLETTER</h2>
            <form>
                <input type="email" placeholder="Enter your email" class="bg-gray-800 p-2 rounded mb-4 w-full">
                <button class="bg-gray-900 text-white py-2 px-4 rounded">SUBSCRIBE</button>
            </form>
        </div>
    </section>
    <script>
        let cart = [];
        const products = [
          {id:1, name:"Midnight Cosmos Vol II", price:45, img:"uploaded-image.jpg"},
          {id:2, name:"Neon Dreams - Limited", price:52, img:"uploaded-image.jpg"},
          {id:3, name:"Sound In The Dark", price:39, img:"uploaded-image.jpg"}
        ];

        function addToCart(id){
          const p = products.find(x=>x.id===id);
          cart.push(p);
          updateCart();
          // Haptic feedback
          if(navigator.vibrate) navigator.vibrate(50);
        }

        function updateCart(){
          const count = document.getElementById('cart-count');
          if(count) count.innerText = cart.length;
          const total = cart.reduce((s,p)=>s+p.price,0);
          console.log(`Cart: ${cart.length} items | $${total}`);
        }
    </script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>
